<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in page</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&family=jetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
    <link rel="stylesheet" type="text/css" href="Css/global.css">
    <link rel="stylesheet" type="text/css" href="Css/auth.css">
</head>
<body>
    <div id="login-container" class="container">
      <h1 id="color">Clar<h1>o</h1></h1>
      <form>
        <fieldset class="form-fieldset">
        <legend>Log in</legend>
        <label for="email">Email</label>
        <input type="email" placeholder="Email here..." name="email" required class="form" id="email">
        <label for="password">Password</label>
        <input type="password" placeholder="Password here..." name="password" required class="form" id="password">
        </fieldset>
        <input type="submit" value="Submit" id="login-btn">
        <p>Don't have an account? <a href="">Sign up</a></p>
      </form>
    </div>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
